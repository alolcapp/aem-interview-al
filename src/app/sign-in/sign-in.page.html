<div class="sign-in">
  <form class="card" novalidate [formGroup]="form" (ngSubmit)="submit()">
    <div class="card-header text-center">Sign in to your dashboard</div>
    <div class="card-body">
      <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>

      <div class="form-group">
        <input type="email" class="form-control" placeholder="Username" formControlName="username"
          autocomplete="username" [class.is-invalid]="isInvalid('username')">
        <div class="invalid-feedback">
          {{ form.controls.username.hasError('required') ? 'Username is required.' : 'Please enter a valid email.' }}
        </div>
      </div>

      <div class="form-group">
        <input type="password" class="form-control" placeholder="Password" formControlName="password"
          autocomplete="current-password" [class.is-invalid]="isInvalid('password')">
        <div class="invalid-feedback">Password is required.</div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || loading">
        {{ loading ? 'SIGNING IN...' : 'SIGN IN' }}
      </button>
    </div>
  </form>
</div>
